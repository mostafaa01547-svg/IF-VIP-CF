<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IF-VIP — Forgot Password</title>
    <link rel="stylesheet" href="../Assets/theme.css">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card">
            <img src="../Assets/logo.png" alt="IF-VIP" class="if-logo" style="width:150px;">
            <h2 class="brand-title">RESET PASSWORD</h2>
            <p class="tagline">Enter your account email and we'll send you reset instructions.</p>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>
            <button class="btn-primary" id="sendBtn">SEND RESET LINK</button>
            <button class="btn-secondary" id="backBtn">BACK TO LOGIN</button>

            <div class="status-msg info" id="statusMsg">
                Note: password-reset emails require an SMTP provider to be configured on the backend
                (see Backend/.env.example). This screen is wired but will not send a real email until that's set up.
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        document.getElementById('backBtn').addEventListener('click', () => {
            ipcRenderer.send('navigate', 'login');
        });
        document.getElementById('sendBtn').addEventListener('click', () => {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = 'Password reset is not fully configured yet — an SMTP provider needs to be added to the backend before real emails can be sent. Contact support in the meantime.';
            statusMsg.className = 'status-msg error';
        });
    </script>
</body>
</html>
